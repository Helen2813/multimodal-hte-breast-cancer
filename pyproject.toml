[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modality-hte"
version = "0.1.0"
description = "Modality-specific prognostic and prescriptive utility for heterogeneous treatment effects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
causal = [
  "econml",
  "doubleml",
  "scikit-learn",
]
survival = [
  "lifelines",
  "scikit-survival",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
